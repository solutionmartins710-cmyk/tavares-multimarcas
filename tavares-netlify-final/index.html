
<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>TAVARES MULTIMARCAS</title>
<style>
  :root{--bg:#fff;--fg:#000;--muted:#666}
  *{box-sizing:border-box}
  body{margin:0;font-family:Inter,system-ui,Arial,Helvetica,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
  header{display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid #000;background:#fff;position:sticky;top:0;z-index:10}
  h1{font-weight:900;letter-spacing:0.5px}
  main{padding:24px;max-width:1100px;margin:0 auto}
  .hero{text-align:center;margin-bottom:28px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
  .card{border:1px solid #000;padding:12px;border-radius:8px;background:#fff;display:flex;flex-direction:column}
  .carousel{display:flex;overflow:hidden;gap:6px}
  .carousel img{width:100%;height:220px;object-fit:cover;border-radius:6px}
  .thumbs{display:flex;gap:6px;overflow:auto;margin-top:8px}
  .thumbs img{width:48px;height:48px;object-fit:cover;border-radius:6px;border:1px solid #ddd;cursor:pointer}
  .price{font-weight:900;margin-top:8px;font-size:18px}
  .controls{display:flex;gap:8px;margin-top:10px}
  aside{margin-top:28px;border-top:1px solid #ddd;padding-top:16px}
  input[type="text"], input[type="tel"], input[type="number"]{padding:8px;border:1px solid #ccc;border-radius:6px;width:100%}
  button{padding:8px 10px;border:1px solid #000;background:#fff;border-radius:6px;cursor:pointer}
  .btn-primary{background:#000;color:#fff;border-color:#000}
  .admin-actions{margin-top:8px;display:flex;gap:8px;flex-direction:column}
  .small{font-size:13px;color:var(--muted)}
  .price-edit{display:flex;gap:6px;align-items:center;margin-top:6px}
  footer{text-align:center;padding:18px;border-top:1px solid #000;margin-top:28px}
  .row{display:flex;gap:8px;align-items:center}
  @media(max-width:600px){header{padding:12px}main{padding:12px}}
</style>
</head>
<body>
<header>
  <h1>TAVARES MULTIMARCAS</h1>
  <div class="row">
    <select id="categorySel" title="Filtrar categoria">
      <option value="TODOS">TODOS</option>
    </select>
    <a href="/admin" style="text-decoration:none"><button id="adminBtn">ADMIN</button></a>
  </div>
</header>

<main>
  <section class="hero">
    <h2 style="font-size:28px;margin:0">ESTILO QUE DEFINE VOCÊ</h2>
    <p class="small" style="margin-top:8px">Catálogo — finalize pedidos pelo WhatsApp</p>
  </section>

  <section id="catalog" class="grid"></section>

  <aside>
    <h3>Carrinho</h3>
    <div id="cartArea"><i>Seu carrinho está vazio</i></div>

    <div style="margin-top:12px;display:flex;gap:8px;flex-direction:column;max-width:480px">
      <input id="name" placeholder="Seu nome" />
      <input id="phone" placeholder="Seu telefone (com DDD)" />
      <div style="display:flex;gap:8px">
        <button id="checkout" class="btn-primary">Finalizar pelo WhatsApp</button>
        <button id="clearCart">Limpar carrinho</button>
      </div>
    </div>
  </aside>
</main>

<footer>© 2025 TAVARES MULTIMARCAS</footer>

<script>
const STORE_WHATSAPP_NUMBER = "5563992825717";
const DEFAULT_PRODUCTS = [
  {id:1,name:"Camiseta Peruana",price:129.90,category:"CAMISETAS",images:["https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=800&q=80"]},
  {id:2,name:"Camiseta Premium",price:149.90,category:"CAMISETAS",images:["https://images.unsplash.com/photo-1583743814966-8936f5b7be1a?w=800&q=80"]},
  {id:3,name:"Camiseta Oversized",price:139.90,category:"CAMISETAS",images:["https://images.unsplash.com/photo-1551028719-00167b16eac5?w=800&q=80"]},
  {id:4,name:"Camiseta Polo",price:179.90,category:"CAMISETAS",images:["https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=800&q=80"]},
  {id:5,name:"Camiseta Dri-fit",price:159.90,category:"CAMISETAS",images:["https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=800&q=80"]},
  {id:6,name:"Bermuda Jeans",price:189.90,category:"BERMUDAS",images:["https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=800&q=80"]},
  {id:7,name:"Bermuda Elastano",price:169.90,category:"BERMUDAS",images:["https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=800&q=80"]},
  {id:8,name:"Bermuda Esportiva",price:149.90,category:"BERMUDAS",images:["https://images.unsplash.com/photo-1591195853828-11db59a44f6b?w=800&q=80"]},
  {id:9,name:"Sandálias",price:89.90,category:"CALCADOS",images:["https://images.unsplash.com/photo-1515548211315-0a6c2f0b3f6f?w=800&q=80"]},
  {id:10,name:"Perfumes",price:219.90,category:"ACESSORIOS",images:["https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800&q=80"]},
  {id:11,name:"Lupas",price:29.90,category:"ACESSORIOS",images:["https://images.unsplash.com/photo-1518779578993-ec3579fee39f?w=800&q=80"]},
  {id:12,name:"Bonés",price:79.90,category:"ACESSORIOS",images:["https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=800&q=80"]}
];

let products = DEFAULT_PRODUCTS.slice();
let cart = [];

// try to load data/products.json (generated by CMS) to override images and prices
fetch('/data/products.json').then(r=>{ if(r.ok) return r.json(); throw null }).then(json=>{ products = json; renderCatalog(); }).catch(()=>{ renderCatalog(); });

const catalogEl = document.getElementById('catalog');
const categorySel = document.getElementById('categorySel');
const cartArea = document.getElementById('cartArea');

function buildCategories(){
  const cats = ['TODOS', ...Array.from(new Set(products.map(p=>p.category)))];
  categorySel.innerHTML = '';
  cats.forEach(c=>{ const opt = document.createElement('option'); opt.value=c; opt.textContent=c; categorySel.appendChild(opt); });
  categorySel.onchange = renderCatalog;
}
function renderCatalog(){
  buildCategories();
  const sel = categorySel.value || 'TODOS';
  catalogEl.innerHTML = '';
  products.filter(p => sel === 'TODOS' || p.category === sel).forEach(p=>{
    const card = document.createElement('article'); card.className='card';
    const carousel = document.createElement('div'); carousel.className='carousel';
    let idx = 0;
    p.images.forEach(img=>{ const im = document.createElement('img'); im.src = img; im.dataset.idx = idx++; carousel.appendChild(im); });
    card.appendChild(carousel);
    const title = document.createElement('div'); title.style.fontWeight='700'; title.textContent = p.name; card.appendChild(title);
    const cat = document.createElement('div'); cat.className='small'; cat.textContent = p.category; card.appendChild(cat);
    const price = document.createElement('div'); price.className='price'; price.textContent = 'R$ ' + Number(p.price).toFixed(2); card.appendChild(price);
    const controls = document.createElement('div'); controls.className='controls';
    const addBtn = document.createElement('button'); addBtn.textContent = 'Adicionar'; addBtn.onclick = ()=>{ addToCart(p.id); };
    const photosBtn = document.createElement('button'); photosBtn.textContent = 'Ver fotos'; photosBtn.onclick = ()=>{ openPhotos(p.id); };
    controls.appendChild(addBtn); controls.appendChild(photosBtn);
    card.appendChild(controls);

    const thumbs = document.createElement('div'); thumbs.className='thumbs';
    p.images.forEach((img,tidx)=>{ const t = document.createElement('img'); t.src=img; t.title='Imagem '+(tidx+1); t.onclick = ()=>{ /* basic jump */ window.open(img,'_blank'); }; thumbs.appendChild(t); });
    card.appendChild(thumbs);

    catalogEl.appendChild(card);
  });
  renderCart();
}

function openPhotos(id){
  const p = products.find(x=>x.id===id);
  const w = window.open('', '_blank');
  w.document.write('<html><head><title>Fotos - '+p.name+'</title></head><body style="font-family:sans-serif">');
  p.images.forEach(img=> w.document.write('<img src="'+img+'" style="max-width:100%;display:block;margin-bottom:8px">'));
  w.document.write('</body></html>');
}

function addToCart(id){
  const found = cart.find(i=>i.id===id);
  if(found) found.qty++;
  else cart.push({id,qty:1});
  renderCart();
}

function renderCart(){
  if(cart.length===0){ cartArea.innerHTML='<i>Seu carrinho está vazio</i>'; return; }
  cartArea.innerHTML='';
  cart.forEach(item=>{
    const p = products.find(x=>x.id===item.id);
    const div = document.createElement('div'); div.style.display='flex'; div.style.justifyContent='space-between'; div.style.marginBottom='8px';
    div.innerHTML = `<div><b>${p.name}</b><div style="font-size:13px">R$ ${Number(p.price).toFixed(2)} x ${item.qty}</div></div>
      <div style="display:flex;gap:6px;align-items:center">
        <button data-minus="${item.id}">-</button>
        <div>${item.qty}</div>
        <button data-plus="${item.id}">+</button>
        <button data-remove="${item.id}">Remover</button>
      </div>`;
    cartArea.appendChild(div);
  });
  cartArea.appendChild(document.createElement('hr'));
  const total = cart.reduce((acc,cur)=>{ const p=products.find(x=>x.id===cur.id); return acc + p.price*cur.qty; },0);
  const totalDiv = document.createElement('div'); totalDiv.style.fontWeight='900'; totalDiv.textContent = 'Total: R$ ' + total.toFixed(2);
  cartArea.appendChild(totalDiv);

  cartArea.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>{ changeQty(Number(b.getAttribute('data-minus')),-1)});
  cartArea.querySelectorAll('[data-plus]').forEach(b=>b.onclick=()=>{ changeQty(Number(b.getAttribute('data-plus')),1)});
  cartArea.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{ removeFromCart(Number(b.getAttribute('data-remove'))) });
}

function changeQty(id,delta){
  const it = cart.find(i=>i.id===id); if(!it) return; it.qty = Math.max(0,it.qty+delta); if(it.qty===0) cart = cart.filter(i=>i.id!==id); renderCart();
}
function removeFromCart(id){ cart = cart.filter(i=>i.id!==id); renderCart(); }

document.getElementById('checkout').onclick = ()=>{
  if(cart.length===0){ alert('Seu carrinho está vazio'); return; }
  const name = document.getElementById('name').value || '-';
  const phone = document.getElementById('phone').value || '-';
  let message = `Olá! Gostaria de finalizar meu pedido:\nNome: ${name}\nTelefone: ${phone}\n\nItens:\n`;
  cart.forEach(i=>{ const p = products.find(x=>x.id===i.id); message += `${i.qty}x ${p.name} - R$ ${Number(p.price).toFixed(2)}\n`; });
  const total = cart.reduce((acc,cur)=>{ const p=products.find(x=>x.id===cur.id); return acc + p.price*cur.qty; },0);
  message += `\nTotal: R$ ${total.toFixed(2)}\nPor favor confirmar disponibilidade e formas de pagamento.`;
  const url = 'https://wa.me/' + STORE_WHATSAPP_NUMBER + '?text=' + encodeURIComponent(message);
  window.open(url,'_blank');
};

document.getElementById('clearCart').onclick = ()=>{ cart = []; renderCart(); };
